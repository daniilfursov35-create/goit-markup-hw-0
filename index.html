<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order your unique jewelry</title>
  <style>
/* --- Базові стилі та скидання --- */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: sans-serif;
  color: #000000;
  background-color: #ffffff;
}

/* --- Секція контактів --- */
.contact-section {
  padding: 60px 20px;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
}

/* --- Заголовок секції --- */
.header-block {
  margin-bottom: 40px;
}

.subtitle {
  font-size: 14px;
  font-weight: 500;
  display: block;
  margin-bottom: 12px;
  color: #000000;
}

.title {
  font-size: 44px;
  font-weight: 400;
  line-height: 1.2;
  margin: 0 0 16px 0;
  letter-spacing: -0.5px;
}

.description {
  font-size: 16px;
  color: #333333;
}

/* --- Головна сітка секції (форма + блок контактів) --- */
.content-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 80px;
  align-items: start;
}

.form-wrapper {
  width: 100%;
}

.form {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.field-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.label {
  font-size: 14px;
  color: #1a1a1a;
  cursor: pointer;
}

/* --- Інпути та Textarea (Стани UI Kit) --- */
.input,
.textarea {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid #e0e0e0;
  border-radius: 0px;
  font-size: 15px;
  background-color: #ffffff;
  outline: none;
  transition: border-color 0.2s ease;
}

.input::placeholder,
.textarea::placeholder {
  color: #999999;
}

.input:hover,
.textarea:hover,
.input:focus,
.textarea:focus {
  border-color: #d8c47f;
}

.textarea {
  resize: vertical;
  min-height: 140px;
}

.input:user-invalid,
.textarea:user-invalid {
  border-color: #eb5757;
}

/* --- Кнопка Submit --- */
.submit-btn {
  background-color: #d8c47f;
  color: #000000;
  border: none;
  padding: 14px 32px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer; /* Зміна курсору за ТЗ */
  width: fit-content;
  border-radius: 0px;
  transition: background-color 0.2s ease;
}

.submit-btn:hover,
.submit-btn:focus {
  background-color: #cbb46b;
}

.submit-btn:active {
  background-color: #bda355;
}

/* --- Сітка для списку контактів (2 колонки для Email/Phone, знизу Office) --- */
.info-wrapper {
  list-style: none;
  margin: 0;
  padding: 20px 0 0 0;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 40px 30px;
}

/* Елемент Office розтягуємо на всю ширину сітки (на обидві колонки) */
.info-item.office-item {
  grid-column: 1 / -1;
}

.info-item {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 12px;
}

.icon-wrapper {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.info-content {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.info-title {
  display: block;
  font-size: 18px;
  font-weight: 500;
}

.info-link {
  font-size: 15px;
  color: #000000;
  text-decoration: underline;
  word-break: break-all;
  cursor: pointer; /* Зміна курсору при наведенні на посилання за ТЗ */
  transition: color 0.2s ease;
}

.info-link:hover {
  color: #2b6cb0;
}

.info-link:active {
  color: #553c9a;
}

/* --- Адаптивність для планшетів (до 1024px) --- */
@media (max-width: 1024px) {
  .content-grid {
    grid-template-columns: 1fr;
    gap: 40px;
  }

  .info-wrapper {
    order: -1;
    grid-template-columns: 1fr 1fr;
    padding-top: 0;
  }

  .title {
    font-size: 36px;
  }
}

/* --- Адаптивність для телефонів (до 768px) --- */
@media (max-width: 768px) {
  .contact-section {
    padding: 40px 16px;
  }

  .info-wrapper {
    grid-template-columns: 1fr;
    gap: 30px;
  }

  .info-item.office-item {
    grid-column: auto;
  }

  .title {
    font-size: 28px;
  }
}
  </style>
</head>
<body>

<section class="contact-section">
  <div class="container">
    <!-- Заголовок -->
    <div class="header-block">
      <span class="subtitle">Connect</span>
      <h2 class="title">Order your unique jewelry</h2>
      <p class="description">We'd love to hear more details from you!</p>
    </div>

    <!-- Основний контент (форма + контакти) -->
    <div class="content-grid">
      
      <!-- Форма з валідацією -->
      <div class="form-wrapper">
        <form class="form" onsubmit="event.preventDefault()">
          
          <div class="field-group">
            <label class="label" for="user-name">Name*</label>
            <input 
              class="input" 
              type="text" 
              id="user-name" 
              name="name" 
              placeholder="Tony" 
              required 
              pattern="^[a-zA-Z\s\.]{5,28}$" 
            />
          </div>

          <div class="field-group">
            <label class="label" for="user-phone">Phone*</label>
            <input 
              class="input" 
              type="tel" 
              id="user-phone" 
              name="phone" 
              placeholder="+1 234 567 8900" 
              required 
              pattern="^\+[0-9\s]{14}$" 
            />
          </div>

          <div class="field-group">
            <label class="label" for="user-message">Describe what you want</label>
            <textarea 
              class="textarea" 
              id="user-message" 
              name="message" 
              placeholder="Type your message..." 
              maxlength="500"
            ></textarea>
          </div>

          <button class="submit-btn" type="submit">Submit</button>
        </form>
      </div>

      <!-- Список контактів через ul/li з використанням SVG-спрайтів -->
      <ul class="info-wrapper">
        <li class="info-item">
          <div class="icon-wrapper">
            <svg width="24" height="24">
              <use href="./images/sprite.svg#icon-mail"></use>
            </svg>
          </div>
          <div class="info-content">
            <span class="info-title">Email</span>
            <a href="mailto:info@handmadejewelry.com" class="info-link">info@handmadejewelry.com</a>
          </div>
        </li>

        <li class="info-item">
          <div class="icon-wrapper">
            <svg width="24" height="24">
              <use href="./images/sprite.svg#icon-phone"></use>
            </svg>
          </div>
          <div class="info-content">
            <span class="info-title">Phone</span>
            <a href="tel:+15550000000" class="info-link">+1 (555) 000-0000</a>
          </div>
        </li>

        <li class="info-item office-item">
          <div class="icon-wrapper">
            <svg width="24" height="24">
              <use href="./images/sprite.svg#icon-map"></use>
            </svg>
          </div>
          <div class="info-content">
            <span class="info-title">Office</span>
            <a 
              href="https://maps.google.com/?q=76-8+Oakington+Manor+Dr,+London,+UK" 
              target="_blank" 
              rel="noopener noreferrer" 
              class="info-link"
            >
              76-8 Oakington Manor Dr, London, UK
            </a>
          </div>
        </li>
      </ul>

    </div>
  </div>
</section>

</body>
</html>
